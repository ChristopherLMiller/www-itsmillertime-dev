<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="shortcut icon" href="%sveltekit.assets%/logo.png" type="image/png" />
		<link rel="shortcut icon" href="%sveltekit.assets%/logo.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&family=Oswald:wght@300;400;500;600;700&family=Permanent+Marker&family=Roboto:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&family=Source+Code+Pro:wght@300;400;500;600;700&family=Special+Elite&family=Delius&display=swap"
			rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<script
			defer
			data-domain="itsmillertime.dev"
			src="https://frosty-lake.itsmillertime.dev/js/script.js"
		></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
			Must stay inline in HTML (not a module): an old service worker was cache-firsting
			client bundles, so SSR painted the correct blog list and then stale JS hydrated
			over it. This runs before %sveltekit.body% modules and clears that once.
		-->
		<script>
			(function () {
				try {
					var flag = 'itsmillertime-sw-reset-v5-articles-ssr-only';
					if (localStorage.getItem(flag)) return;
					if (!('serviceWorker' in navigator) && typeof caches === 'undefined') {
						localStorage.setItem(flag, '1');
						return;
					}
					Promise.all([
						'serviceWorker' in navigator
							? navigator.serviceWorker.getRegistrations()
							: Promise.resolve([]),
						typeof caches !== 'undefined' ? caches.keys() : Promise.resolve([])
					]).then(function (results) {
						var regs = results[0];
						var keys = results[1];
						localStorage.setItem(flag, '1');
						if (!regs.length && !keys.length) return;
						return Promise.all([
							Promise.all(regs.map(function (reg) { return reg.unregister(); })),
							Promise.all(keys.map(function (key) { return caches.delete(key); }))
						]).then(function () {
							location.reload();
						});
					});
				} catch (e) {}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
